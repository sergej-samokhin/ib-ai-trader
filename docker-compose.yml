# IB Gateway (with IBC for automated login/restarts) + ibtrader.
# The gateway image is a community image - review it before use.
# Pinned by tag AND digest (Gateway 10.50.1f with bundled IBC = `stable` on 2026-10-18; digest of
# the multi-arch index read from ghcr.io that day). Update both together, then re-test on paper.
services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:10.50.1f@sha256:1e2236804ac949b789197c225a048c0c891c9958f948c87166226e5b647ff581
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: "no"
      TWOFA_TIMEOUT_ACTION: restart
      AUTO_RESTART_TIME: "11:59 PM"
      TIME_ZONE: America/New_York
    # API ports are reachable only inside the compose network.
    expose:
      - "4003"  # live API (socat relay inside the image)
      - "4004"  # paper API

  ibtrader:
    build: .
    restart: unless-stopped
    depends_on: [ib-gateway]
    env_file: .env
    environment:
      IB_HOST: ib-gateway
      IB_PORT: ${IB_PORT:-4004}
    volumes:
      - ./var:/app/var
      - ./config:/app/config:ro
